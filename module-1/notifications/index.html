<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles/main.css">
    <script src="https://kit.fontawesome.com/bc194a3937.js" crossorigin="anonymous"></script>
    <title>Order</title>
</head>

<body>
    <form>
        <h2>Make an order</h2>
        <input type="text" placeholder="Address" required>
        <input type="text" placeholder="Price" required>
        <input type="text" placeholder="Reciever" required>
        <button type="submit">Create</button>
    </form>
    <div class="order-btns hidden">
        <button class="paid-btn">Paid</button>
        <button class="sent-btn">Sent</button>
        <button class="recieved-btn">Recieved</button>
        <!-- Новая кнопка для тестирования ошибок -->
        <button class="error-btn">Test Error</button>
    </div>
    <div class="notifications-container"></div>
</body>
<script src="scripts/main.js"></script>

</html>
